services:
  ollama:
    image: ollama/ollama:0.33.3
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ~/.ollama/data:/app/data
    environment:
      - OLLAMA_ENV=production
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  phoenix:
    image: arizephoenix/phoenix:version-20.26.1
    container_name: phoenix
    ports:
      - "6006:6006"
    volumes:
      - phoenix_data:/mnt/data
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data

  adk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adk
    ports:
      - 8000:8000
    volumes:
      - .:/app
    depends_on:
      - ollama
      - phoenix
    environment:
      - OLLAMA_API_BASE=http://ollama:11434  
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://phoenix:6006/v1/traces
      - OTEL_RESOURCE_ATTRIBUTES=openinference.project.name=sql_agent_secure
      - PHOENIX_BASE_URL=http://phoenix:6006

volumes:
  phoenix_data:
