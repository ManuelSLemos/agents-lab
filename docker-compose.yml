services:
  ollama:
    image: ollama/ollama:0.33.3
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ~/.ollama/data:/app/data
    environment:
      - OLLAMA_ENV=production
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  adk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adk
    ports:
      - 8000:8000
    volumes:
      - .:/app
    depends_on:
      - ollama
    environment:
      - OLLAMA_API_BASE=http://ollama:11434  