# Production-like stack: no source mounts, no UI, no reload.
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  phoenix:
    image: arizephoenix/phoenix:version-20.26.1
    restart: unless-stopped
    ports:
      - "6006:6006"
    volumes:
      - phoenix_data:/mnt/data
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data

  agent:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./Chinook.db:/data/Chinook.db:ro
    environment:
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      - CHINOOK_DB_PATH=/data/Chinook.db
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://phoenix:6006/v1/traces
      - OTEL_RESOURCE_ATTRIBUTES=openinference.project.name=sql_agent_secure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - phoenix

volumes:
  phoenix_data:
